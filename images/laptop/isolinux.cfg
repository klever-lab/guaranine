serial 0 115200
default laptop
prompt 1
timeout 100
say Guaranine laptop installer - ALL DATA on the selected disk will be lost
say Press ENTER to install using the screen and keyboard, or type serial for a serial console.
label laptop
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/initrd.gz auto=true priority=critical preseed/file=/cdrom/preseed.cfg --- quiet
label serial
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/initrd.gz auto=true priority=critical preseed/file=/cdrom/preseed.cfg DEBIAN_FRONTEND=text console=ttyS0,115200n8 --- console=ttyS0,115200n8
