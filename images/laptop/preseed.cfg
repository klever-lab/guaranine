# Disk selection and all destructive confirmations are deliberately NOT preseeded.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-worker
d-i netcfg/get_domain string
d-i mirror/country string manual
d-i mirror/http/hostname string snapshot.debian.org
d-i mirror/http/directory string /archive/debian/20261101T000000Z
d-i mirror/http/proxy string
d-i mirror/suite string trixie
d-i apt-setup/security_host string
d-i apt-setup/services-select multiselect
d-i apt-setup/non-free-firmware boolean true
d-i debian-installer/allow_unauthenticated boolean false
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Laptop operator
d-i passwd/username string fleetadmin
# A NEW local operator password must be entered interactively; there is no default.
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true
d-i partman-auto/method string regular
d-i partman/early_command string /bin/sh /cdrom/guaranine/select-disk.sh
d-i partman-auto/expert_recipe string worker :: 512 512 512 free $iflabel{ gpt } $reusemethod{ } method{ efi } format{ } . 1024 10000 -1 ext4 $primary{ } $bootable{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ / } .
d-i partman-auto/choose_recipe select worker
d-i partman-basicfilesystems/no_swap boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/use_mirror boolean false
tasksel tasksel/first multiselect
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true
# A single selected disk is the only installation target; no fixed /dev/sda here.
d-i preseed/early_command string mkdir -p /etc/apt/apt.conf.d; echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99snapshot
d-i preseed/late_command string /bin/sh /cdrom/guaranine/late.sh
d-i finish-install/reboot_in_progress note
