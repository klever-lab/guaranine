version: v1alpha1
cluster:
  etcd:
    advertisedSubnets:
      - 100.64.0.0/10
    listenSubnets:
      - 100.64.0.0/10
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
backendType: vxlan
backendPort: 4789
# The control plane deploys this Flannel configuration to every node.
# Tailscale's tunnel MTU; Flannel subtracts its encapsulation overhead.
backendMTU: 1280
extraArgs:
  - --iface=tailscale0
kubeNetworkPoliciesEnabled: true
