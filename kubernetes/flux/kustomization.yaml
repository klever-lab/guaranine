apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Upstream release asset SHA-256: 4db2fb9ce179622327d3a9a36a765bbfc0329fd50690e8d37da7dd0918b09392
  - https://github.com/fluxcd/flux2/releases/download/v2.10.1/install.yaml
  - rbac.yaml
  - network-policy.yaml
patches:
  # Install only source-controller and kustomize-controller; drop unused controllers,
  # CRDs, roles and permissive upstream NetworkPolicies.
  - target: {kind: Deployment, name: helm-controller}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: helm-controller, namespace: flux-system}
  - target: {kind: Deployment, name: image-automation-controller}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: image-automation-controller, namespace: flux-system}
  - target: {kind: Deployment, name: image-reflector-controller}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: image-reflector-controller, namespace: flux-system}
  - target: {kind: Deployment, name: notification-controller}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: notification-controller, namespace: flux-system}
  - target: {kind: Deployment, name: source-watcher}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: source-watcher, namespace: flux-system}
  - target: {kind: ServiceAccount, name: helm-controller}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata: {name: helm-controller, namespace: flux-system}
  - target: {kind: ServiceAccount, name: image-automation-controller}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata: {name: image-automation-controller, namespace: flux-system}
  - target: {kind: ServiceAccount, name: image-reflector-controller}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata: {name: image-reflector-controller, namespace: flux-system}
  - target: {kind: ServiceAccount, name: notification-controller}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata: {name: notification-controller, namespace: flux-system}
  - target: {kind: ServiceAccount, name: source-watcher}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata: {name: source-watcher, namespace: flux-system}
  - target: {kind: Service, name: notification-controller}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: {name: notification-controller, namespace: flux-system}
  - target: {kind: Service, name: source-watcher}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: {name: source-watcher, namespace: flux-system}
  - target: {kind: Service, name: webhook-receiver}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: {name: webhook-receiver, namespace: flux-system}
  - target: {kind: CustomResourceDefinition, name: alerts.notification.toolkit.fluxcd.io}
    patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata: {name: alerts.notification.toolkit.fluxcd.io}
  - target: {kind: CustomResourceDefinition, name: providers.notification.toolkit.fluxcd.io}
    patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata: {name: providers.notification.toolkit.fluxcd.io}
  - target: {kind: CustomResourceDefinition, name: receivers.notification.toolkit.fluxcd.io}
    patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata: {name: receivers.notification.toolkit.fluxcd.io}
  - target: {kind: CustomResourceDefinition, name: helmreleases.helm.toolkit.fluxcd.io}
    patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata: {name: helmreleases.helm.toolkit.fluxcd.io}
  - target: {kind: CustomResourceDefinition, name: imagepolicies.image.toolkit.fluxcd.io}
    patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata: {name: imagepolicies.image.toolkit.fluxcd.io}
  - target: {kind: CustomResourceDefinition, name: imagerepositories.image.toolkit.fluxcd.io}
    patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata: {name: imagerepositories.image.toolkit.fluxcd.io}
  - target: {kind: CustomResourceDefinition, name: imageupdateautomations.image.toolkit.fluxcd.io}
    patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata: {name: imageupdateautomations.image.toolkit.fluxcd.io}
  - target: {kind: CustomResourceDefinition, name: artifactgenerators.source.extensions.fluxcd.io}
    patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata: {name: artifactgenerators.source.extensions.fluxcd.io}
  - target: {kind: ClusterRole, name: crd-controller}
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata: {name: crd-controller}
  - target: {kind: ClusterRoleBinding, name: crd-controller}
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata: {name: crd-controller}
  - target: {kind: ClusterRoleBinding, name: cluster-reconciler}
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata: {name: cluster-reconciler}
  - target: {kind: ClusterRole, name: flux-edit}
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata: {name: flux-edit}
  - target: {kind: ClusterRole, name: flux-view}
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata: {name: flux-view}
  - target: {kind: NetworkPolicy, name: allow-egress}
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: allow-egress, namespace: flux-system}
  - target: {kind: NetworkPolicy, name: allow-scraping}
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: allow-scraping, namespace: flux-system}
  - target: {kind: NetworkPolicy, name: allow-webhooks}
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: allow-webhooks, namespace: flux-system}
  - target: {kind: Namespace, name: flux-system}
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: flux-system
        labels:
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/enforce-version: latest
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted
  - target: {kind: Deployment, name: source-controller}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/fluxcd/source-controller:v1.10.2@sha256:1405a9e460833df9aff920664243c0df271f42be05e0bf38db31d2b7e9ebbaab
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - --watch-all-namespaces=false
          - --log-level=info
          - --log-encoding=json
          - --enable-leader-election
          - --storage-path=/data
          - --storage-adv-addr=source-controller.$(RUNTIME_NAMESPACE).svc.cluster.local.
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 512Mi}
  - target: {kind: Deployment, name: kustomize-controller}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/fluxcd/kustomize-controller:v1.10.2@sha256:e122808057ef0f6a3cb7fbd8e256b5a528d8a59f41d237f2d6664f54481c26d9
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - --watch-all-namespaces=false
          - --no-remote-bases=true
          - --no-cross-namespace-refs=true
          - --default-service-account=flux-unprivileged
          - --log-level=info
          - --log-encoding=json
          - --enable-leader-election
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 512Mi}
