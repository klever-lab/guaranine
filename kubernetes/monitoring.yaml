    - {name: http, port: 3000, targetPort: http}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: monitoring}
spec:
  selector: {app: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: http}
---
apiVersion: v1
kind: Service
metadata: {name: kube-state-metrics, namespace: monitoring}
spec:
  selector: {app: kube-state-metrics}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: monitoring-proxy, namespace: monitoring}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: monitoring-proxy}
  template:
    metadata:
      labels: {app: monitoring-proxy}
    spec:
      serviceAccountName: monitoring-proxy
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        supplementalGroupsPolicy: Strict
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: tailscale
          image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
          env:
            - {name: TS_HOSTNAME, value: monitoring}
            - {name: TS_USERSPACE, value: "true"}
            - {name: TS_AUTH_ONCE, value: "true"}
            - {name: TS_ACCEPT_DNS, value: "false"}
            - {name: TS_EXTRA_ARGS, value: "--accept-routes=false --ssh=false"}
            - {name: TS_KUBE_SECRET, value: monitoring-tailscale}
            - {name: TS_STATE_DIR, value: /var/lib/tailscale}
            - {name: TS_SOCKET, value: /var/run/tailscale/tailscaled.sock}
            - {name: TS_SERVE_CONFIG, value: /etc/tailscale/serve.json}
            - {name: TS_ENABLE_HEALTH_CHECK, value: "true"}
            - {name: TS_LOCAL_ADDR_PORT, value: "0.0.0.0:9002"}
          ports:
            - {name: health, containerPort: 9002}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          startupProbe:
            tcpSocket: {port: health}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: health}
          livenessProbe:
            tcpSocket: {port: health}
          volumeMounts:
            - {name: config, mountPath: /etc/tailscale, readOnly: true}
            - {name: state-cache, mountPath: /var/lib/tailscale}
            - {name: socket, mountPath: /var/run/tailscale}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: monitoring-proxy}
        - name: state-cache
          emptyDir: {sizeLimit: 64Mi}
        - name: socket
          emptyDir: {sizeLimit: 1Mi}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: monitoring}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        supplementalGroupsPolicy: Strict
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
          ports:
            - {name: http, containerPort: 3000}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            timeoutSeconds: 30
            failureThreshold: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /etc/grafana/grafana.ini, subPath: grafana.ini, readOnly: true}
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml, readOnly: true}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml, readOnly: true}
            - {name: config, mountPath: /etc/grafana/dashboards/overview.json, subPath: overview.json, readOnly: true}
            - {name: config, mountPath: /etc/grafana/dashboards/ovh.json, subPath: ovh.json, readOnly: true}
            - {name: secrets, mountPath: /etc/grafana/secrets, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: grafana}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: config
          configMap: {name: grafana}
        - name: secrets
          secret: {secretName: grafana, defaultMode: 0440}
