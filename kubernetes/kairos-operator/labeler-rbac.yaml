# Upstream accepts this narrower role. Admission limits patches to the caller's
# own node and its Kairos metadata.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: kairos-node-labeler}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: kairos-node-labeler, namespace: kairos-operator}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: kairos-node-labeler}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kairos-node-labeler}
subjects: [{kind: ServiceAccount, name: kairos-node-labeler, namespace: kairos-operator}]
