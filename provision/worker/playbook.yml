---
- name: Configure one Debian laptop as an agent over Tailscale
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    profile: /usr/lib/guaranine
    helper: /usr/local/sbin/guaranine-worker
  tasks:
    - name: Configure and verify worker without emitting runtime input
      no_log: true
      block:
        - name: Refuse a server or another worker identity
          ansible.builtin.command: "{{ helper }} stage preflight"
          changed_when: false
        - name: Load required networking modules
          ansible.builtin.copy:
            dest: /etc/modules-load.d/guaranine.conf
            content: "overlay\nbr_netfilter\n"
            mode: '0644'
        - name: Load modules now
          ansible.builtin.command: "modprobe {{ item }}"
          loop: [overlay, br_netfilter]
          changed_when: false
        - name: Enable pod forwarding
          ansible.builtin.copy:
            dest: /etc/sysctl.d/90-guaranine.conf
            content: "net.ipv4.ip_forward=1\nnet.bridge.bridge-nf-call-iptables=1\nnet.bridge.bridge-nf-call-ip6tables=1\n"
            mode: '0644'
        - name: Apply forwarding
          ansible.builtin.command: sysctl --system
          changed_when: false
        - name: Disable swap now
          ansible.builtin.command: swapoff -a
          changed_when: false
        - name: Disable swap persistently
          ansible.builtin.replace:
            path: /etc/fstab
            regexp: '^(\s*[^#\n]+\s+\S+\s+swap\s+.*)$'
            replace: '# Guaranine disabled swap: \1'
        - name: Keep laptop awake with closed lid
          ansible.builtin.copy:
            dest: /etc/systemd/logind.conf.d/guaranine.conf
            content: "[Login]\nHandleLidSwitch=ignore\nHandleLidSwitchExternalPower=ignore\nHandleLidSwitchDocked=ignore\nIdleAction=ignore\n"
            mode: '0644'
        - name: Install transport firewall
          ansible.builtin.copy:
            src: files/network.nft
            dest: /etc/guaranine-network.nft
            mode: '0644'
        - name: Check firewall syntax
          ansible.builtin.command: nft --check --file /etc/guaranine-network.nft
          changed_when: false
        - name: Enable transport firewall
          ansible.builtin.systemd_service:
            name: guaranine-network
            enabled: true
            state: restarted
            daemon_reload: true
        - name: Restrict SSH to keys and disable root login
          ansible.builtin.copy:
            src: files/sshd.conf
            dest: /etc/ssh/sshd_config.d/90-guaranine.conf
            mode: '0644'
        - name: Generate unique SSH keys if missing
          ansible.builtin.command: ssh-keygen -A
          changed_when: false
        - name: Apply SSH policy
          ansible.builtin.systemd_service:
            name: ssh
            state: reloaded
        - name: Join or resume Tailscale and discover the node address
          ansible.builtin.command: "{{ helper }} stage tailscale"
          changed_when: false
        - name: Write pinned agent configuration
          ansible.builtin.command: "{{ helper }} stage agent-config"
          changed_when: false
        - name: Install agent using checksum-pinned upstream installer, never a server
          ansible.builtin.command: /bin/sh /usr/lib/guaranine/vendor/install-k3s.sh agent
          environment:
            INSTALL_K3S_SKIP_DOWNLOAD: 'true'
            INSTALL_K3S_SKIP_ENABLE: 'true'
            INSTALL_K3S_SKIP_START: 'true'
            INSTALL_K3S_EXEC: agent
          args:
            creates: /etc/systemd/system/k3s-agent.service
        - name: Add transport ordering to agent
          ansible.builtin.copy:
            dest: /etc/systemd/system/k3s-agent.service.d/guaranine.conf
            content: "[Unit]\nWants=\nAfter=\nRequires=guaranine-network.service tailscaled.service\nAfter=network.target guaranine-network.service tailscaled.service\n[Service]\nStandardOutput=null\nStandardError=null\n"
            mode: '0644'
        - name: Start agent
          ansible.builtin.systemd_service:
            name: k3s-agent
            state: started
            enabled: true
            daemon_reload: true
            no_block: true
        - name: Verify registration, resources and real scheduler placement
          ansible.builtin.command: "{{ helper }} stage verify"
          changed_when: false
          timeout: 540
