# Render NODE_NAME and VERIFY_NAMESPACE with scripts/iso/issue-credentials.py.
# This credential can inspect only its node and run unprivileged, quota-bound
# probe pods in a dedicated namespace. It cannot administer the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: VERIFY_NAMESPACE
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enrollment-verifier
  namespace: VERIFY_NAMESPACE
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: VERIFY_NAMESPACE
rules:
  - apiGroups: ['']
    resources: [nodes]
    resourceNames: [NODE_NAME]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: VERIFY_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: VERIFY_NAMESPACE
subjects:
  - kind: ServiceAccount
    name: enrollment-verifier
    namespace: VERIFY_NAMESPACE
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enrollment-verifier
  namespace: VERIFY_NAMESPACE
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enrollment-verifier
  namespace: VERIFY_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: enrollment-verifier
subjects:
  - kind: ServiceAccount
    name: enrollment-verifier
    namespace: VERIFY_NAMESPACE
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: enrollment-probe
  namespace: VERIFY_NAMESPACE
spec:
  hard:
    pods: '1'
    requests.cpu: 50m
    requests.memory: 32Mi
    requests.ephemeral-storage: 32Mi
    limits.cpu: 50m
    limits.memory: 32Mi
    limits.ephemeral-storage: 32Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-probe
  namespace: VERIFY_NAMESPACE
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
