name: Private image builds
on:
  pull_request:
    paths:
      - 'talos/**'
      - 'scripts/guaranine.py'
      - 'scripts/test-private-images.py'
      - 'guaranine'
      - 'requirements.txt'
      - '.github/workflows/private-images.yml'
  push:
    branches: [main]
    paths:
      - 'talos/**'
      - 'scripts/guaranine.py'
      - 'scripts/test-private-images.py'
      - 'guaranine'
      - 'requirements.txt'
      - '.github/workflows/private-images.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python3 -m pip install --requirement requirements.txt
      - name: Build disposable private ISO and Azure VHD with upstream imager
        run: python3 scripts/test-private-images.py
