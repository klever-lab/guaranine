name: Sync Tailscale policy
on:
  push:
    branches: [main]
    paths:
      - 'tailscale/policy.json'
      - '.github/workflows/tailscale-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tailscale-policy
  cancel-in-progress: false
jobs:
  apply:
    name: Apply tailnet policy
    if: github.ref == 'refs/heads/main'
    environment: tailscale
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1.5.2
        with:
          tailnet: ${{ vars.TS_TAILNET }}
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          policy-file: tailscale/policy.json
          action: apply
