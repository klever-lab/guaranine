name: Talos laptop ISO
on:
  pull_request:
    paths:
      - 'images/**'
      - 'talos/**'
      - 'scripts/**'
      - 'guaranine'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/**'
  push:
    branches: [main]
    tags: ['worker-iso-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: laptop-iso-${{ github.ref }}
  cancel-in-progress: false
jobs:
  trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a versioned tag on main history with passing CI
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/talos/check-release-ref.sh
  build-test:
    needs: trust
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install validation and disposable guest tools
        run: |
          python3 -m pip install --requirement requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
          sudo chmod a+rw /dev/kvm
      - name: Build disposable private ISO and Azure VHD with upstream imager
        run: python3 scripts/talos/private-smoke.py
      - name: Fetch the pinned public Talos ISO
        run: python3 scripts/talos/images.py public --output "$RUNNER_TEMP/iso"
      - name: Required actual-image BIOS and UEFI boot tests
        run: python3 scripts/talos/qemu-test.py "$RUNNER_TEMP/iso"
      - name: Bind passing boot evidence to the exact public ISO
        run: python3 scripts/talos/images.py finalize "$RUNNER_TEMP/iso"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-worker-iso
          path: |
            ${{ runner.temp }}/iso/guaranine-talos-amd64.iso
            ${{ runner.temp }}/iso/SHA256SUMS
            ${{ runner.temp }}/iso/build.json
            ${{ runner.temp }}/iso/qemu-results.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/worker-iso-v')
    needs: [trust, build-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tested-worker-iso
          path: ${{ runner.temp }}/iso
      - name: Publish only the tested immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python3 scripts/talos/publish-release.py "$RUNNER_TEMP/iso"
