# Repository validation shared with Clusterfork Symphony.
name: Clusterfork repository validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    name: Clusterfork validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python3 -m pip install --requirement requirements-dev.txt
      - name: Run repository validation
        run: bash scripts/validate.sh
